<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>App Pages</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f4f4f4;
      color: #1a1a1a;
      padding: 40px 24px;
    }
    h1 { font-size: 22px; font-weight: 800; margin-bottom: 32px; color: #333; }
    .apps { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; max-width: 900px; }
    .app-card {
      background: #fff;
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
    }
    .app-card h2 { font-size: 16px; font-weight: 700; margin-bottom: 14px; }
    .app-card a {
      display: block;
      font-size: 14px;
      text-decoration: none;
      padding: 7px 0;
      border-bottom: 1px solid #f0f0f0;
    }
    .app-card a:last-child { border-bottom: none; }
    .app-card a:hover { text-decoration: underline; }
    .pockyt h2 { color: #2c5f8a; }
    .pockyt a { color: #2c5f8a; }
    .lymphalight h2 { color: #6b5b95; }
    .lymphalight a { color: #6b5b95; }
    .littlemirror h2 { color: #c87a6d; }
    .littlemirror a { color: #c87a6d; }
    .twirl h2 { color: #e07b39; }
    .twirl a { color: #e07b39; }
  </style>
</head>
<body>
  <h1>App Pages</h1>
  <div class="apps">
    <div class="app-card pockyt">
      <h2>Pockyt</h2>
      <a href="/pockyt/privacy-policy.html">Privacy Policy</a>
      <a href="/pockyt/support.html">Support</a>
    </div>
    <div class="app-card lymphalight">
      <h2>LymphaLight</h2>
      <a href="/lymphalight/privacy-policy.html">Privacy Policy</a>
      <a href="/lymphalight/support.html">Support</a>
    </div>
    <div class="app-card littlemirror">
      <h2>Little Mirrors</h2>
      <a href="/littlemirror/privacy-policy.html">Privacy Policy</a>
      <a href="/littlemirror/support.html">Support</a>
    </div>
    <div class="app-card twirl">
      <h2>Twirl · 木鱼</h2>
      <a href="/twirl/privacy-policy.html">Privacy Policy</a>
      <a href="/twirl/support.html">Support</a>
    </div>
  </div>
</body>
</html>
